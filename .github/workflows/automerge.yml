name: Auto-merge

# Automatic merge into dev, once every required check passes:
# - a bot's pull request (Dependabot): the CI is enough, CodeRabbit does not review bots;
# - a maintainer's pull request: CodeRabbit must ALSO have really reviewed its head commit: its
#   check run on that commit concluded "success" with "Review completed". A skipped review (path
#   filters, quota, error) concludes "skipped", which still counts as passing among the checks, so
#   the bucket alone is not enough; a clean review posts no pull request review, so reviews cannot
#   be counted either. Without a real review, the pull request stays open and a review is asked
#   once, 45 minutes after the checks passed. Every remark CodeRabbit leaves must also be resolved
#   (fixed, or answered and marked resolved): an open one keeps the pull request open.
# A failing check leaves the pull request open. Dependabot security updates always target main:
# they are moved to dev.

on:
  pull_request:
    branches: [dev, main]
    # `edited` covers a base changed to dev after the opening.
    types: [opened, synchronize, reopened, ready_for_review, edited]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  automerge:
    name: Auto-merge
    if: >-
      github.event.pull_request.draft == false &&
      (github.event_name == 'pull_request' ||
       github.event.review.user.login == 'coderabbitai[bot]') &&
      (github.event.pull_request.user.login == 'dependabot[bot]' ||
       (github.event.pull_request.base.ref == 'dev' &&
        (github.event.pull_request.user.type == 'Bot' ||
         github.event.pull_request.user.login == github.repository_owner)))
    runs-on: ubuntu-24.04
    # The CI may take up to 120 minutes, then up to 90 minutes of waiting for the review.
    timeout-minutes: 240
    # At job level: a run whose job is skipped (a human review) must not cancel the active loop.
    concurrency:
      group: automerge-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      actions: write
      # Read by `gh pr checks` (check runs and commit statuses).
      checks: read
      statuses: read
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      BOT: ${{ github.event.pull_request.user.type == 'Bot' }}
    steps:
      - name: Move a security update to dev
        if: github.event.pull_request.base.ref == 'main'
        run: |
          gh pr edit "$PR" --base dev
          gh workflow run ci.yml --ref "$HEAD_REF"

      - name: Merge once the checks pass and CodeRabbit really reviewed
        run: |
          head=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          marker='<!-- auto-merge: review asked -->'
          waited=0
          # Until the checks end (the job timeout bounds a CI that never ends), then 90 minutes.
          while :; do
            now=$(gh pr view "$PR" --json state,headRefOid --jq '.state + " " + .headRefOid')
            # Merged, closed, or a newer commit (its own run takes over).
            if [ "$now" != "OPEN $head" ]; then exit 0; fi
            checks=$(gh pr checks "$PR" --required --json bucket --jq '
              if any(.[]; .bucket == "fail" or .bucket == "cancel") then "fail"
              elif length > 0 and all(.[]; .bucket == "pass" or .bucket == "skipping") then "pass"
              else "wait" end' || true)
            if [ "$checks" = fail ]; then exit 0; fi
            if [ "$checks" = pass ]; then
              reviews=1
              open=0
              if [ "$BOT" != true ]; then
                reviews=$(gh api "repos/$GH_REPO/commits/$head/check-runs?check_name=CodeRabbit" --jq '
                  [.check_runs[] | select(.app.slug == "coderabbitai" and .conclusion == "success"
                    and ((.output.summary // "") | contains("Review completed")))] | length' || echo 0)
                # CodeRabbit's remarks still open (unresolved threads it started); counted as one
                # when the query fails, so a failure never merges.
                open=$(gh api graphql -F owner="${GH_REPO%/*}" -F name="${GH_REPO#*/}" -F pr="$PR" -f query='
                  query($owner: String!, $name: String!, $pr: Int!) {
                    repository(owner: $owner, name: $name) {
                      pullRequest(number: $pr) {
                        reviewThreads(first: 100) {
                          nodes { isResolved comments(first: 1) { nodes { author { login } } } }
                        }
                      }
                    }
                  }' --jq '[.data.repository.pullRequest.reviewThreads.nodes[]
                    | select((.isResolved | not) and .comments.nodes[0].author.login == "coderabbitai")]
                    | length' || echo 1)
              fi
              if [ "$reviews" -gt 0 ] && [ "$open" -eq 0 ]; then
                gh pr merge "$PR" --merge --match-head-commit "$head"
                exit 0
              fi
              # No real review 45 minutes after the checks passed: ask once for this pull
              # request, never again (the command must stand alone on its line), and keep
              # waiting for it 45 minutes more. Open remarks wait the same 90 minutes for their
              # threads to be resolved; later, a new commit or a re-run takes over.
              waited=$((waited + 1))
              if [ "$reviews" -eq 0 ] && [ "$waited" -eq 90 ] &&
                ! gh api "repos/$GH_REPO/issues/$PR/comments" --paginate --jq '.[].body' | grep -qF "$marker"; then
                gh pr comment "$PR" --body "$(printf '@coderabbitai review\n\n%s' "$marker")"
              fi
              if [ "$waited" -ge 180 ]; then exit 0; fi
            fi
            sleep 30
          done
