name: Audit

# Known vulnerabilities in the dependency tree (RustSec advisory database).
on:
  push:
    branches: [main]
    paths: [Cargo.lock, Cargo.toml, "**/Cargo.toml"]
  pull_request:
    paths: [Cargo.lock, Cargo.toml, "**/Cargo.toml"]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to a commit, the tag in the comment (kept up to date by Dependabot).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-audit
      - run: cargo audit
