name: Audit

# Known vulnerabilities in the dependency tree (RustSec advisory database).
on:
  push:
    branches: [main]
    paths: [Cargo.lock, Cargo.toml, "**/Cargo.toml"]
  pull_request:
    paths: [Cargo.lock, Cargo.toml, "**/Cargo.toml"]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to a commit, the tag in the comment (kept up to date by Dependabot).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit
      - run: cargo audit
