name: Audit

# Known vulnerabilities in the dependency tree (RustSec advisory database).
on:
  push:
    branches: [main]
    paths: [Cargo.lock, Cargo.toml, "**/Cargo.toml"]
  pull_request:
    paths: [Cargo.lock, Cargo.toml, "**/Cargo.toml"]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
