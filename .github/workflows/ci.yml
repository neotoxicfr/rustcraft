name: CI

# Each job runs only when a file it reads changed (job `changes`): a README, the docs or the
# repository settings alone start neither the Rust checks nor the Python tool tests.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Quicker release builds for the checks; published builds keep the full profile.
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_DEBUG: "false"

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.parts.outputs.rust }}
      tools: ${{ steps.parts.outputs.tools }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A pull request is compared with the commit it is merged onto, a push with the commit before
      # it. Without a usable base (manual run, first push of a branch), everything runs.
      - id: parts
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base="$BEFORE"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then base=$(git rev-parse HEAD^1); fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "tools=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$base" HEAD)
          echo "$files"
          # Read by no build and no test: root Markdown and licences, docs, release packaging and
          # the repository settings other than this workflow.
          not_rust='^([^/]+\.md|LICENSE-[^/]+|\.gitignore|docs/.*|packaging/.*|\.github/(ISSUE_TEMPLATE/.*|[^/]+|workflows/(audit|release|reproducibility)\.yml))$'
          # Read by the Python tool tests.
          python_tools='^(tools/.*|packaging/.*|\.github/workflows/ci\.yml)$'
          rust=false
          tools=false
          if [ -n "$files" ] && echo "$files" | grep -Evq "$not_rust"; then rust=true; fi
          if echo "$files" | grep -Eq "$python_tools"; then tools=true; fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "tools=$tools" >> "$GITHUB_OUTPUT"

  rust:
    name: Clippy and tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    # Frozen inputs: actions pinned to a commit (the tag only in the comment, which Dependabot
    # keeps up to date) and `--locked` on every cargo call, so a Cargo.lock that no longer
    # matches the manifests fails instead of being rewritten silently on the runner.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy, warnings as errors
        run: cargo clippy --locked --release --workspace --all-targets -- -D warnings
      # Most tests compare with the official game's data: the game is downloaded from Mojang's
      # servers like the launcher does (nothing is stored in the repository), then prepared.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - name: Official game 26.3
        shell: bash
        run: |
          python -I tools/ci/fetch_game.py "$RUNNER_TEMP/minecraft" 26.3
          echo "RUSTCRAFT_MC_DIR=$RUNNER_TEMP/minecraft" >> "$GITHUB_ENV"
          echo "RUSTCRAFT_CACHE=$RUNNER_TEMP/rustcraft-cache" >> "$GITHUB_ENV"
      - name: Game data
        run: cargo run --locked --release -p rc-data --example prepare -- 26.3
      - name: Tests
        run: cargo test --locked --release --workspace --no-fail-fast
      # One invalid line makes the game refuse a whole function, and one refused chat command
      # leaves a scene measuring an empty view: the bench's `perf` pack functions and every
      # scene's chat commands are compiled with our command parser
      # (`crates/rc-sim/src/tests_perf_pack.rs`, both ignored tests of the module).
      - name: Bench data pack compiles
        shell: bash
        env:
          RUSTCRAFT_PERF_PACK: ${{ github.workspace }}/target/perf-pack/datapacks/perf
        run: |
          python -I tools/bench/scenes.py pack-files target/perf-pack
          cargo test --locked --release -p rc-sim tests_perf_pack:: -- --ignored

  tools:
    name: Python tools
    needs: changes
    if: needs.changes.outputs.tools == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -I tools/bench/test_scenes.py
      - run: python -I tools/bench/test_perf_pack.py
      - run: python -I tools/bench/test_fixtures.py
      - run: python -I tools/bench/test_build_matrix.py
      - run: python -I tools/release/test_release.py
