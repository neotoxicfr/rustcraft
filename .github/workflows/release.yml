name: Release

# Pushing a tag vX.Y.Z builds Windows and Linux, and publishes the release with an empty body;
# the hand-written notes are added afterwards (`gh release edit vX.Y.Z --notes-file …`).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Release with an empty body
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Rustcraft $GITHUB_REF_NAME" --notes "" --verify-tag

  build:
    needs: create
    name: Build (${{ matrix.os }})
    strategy:
      matrix:
        # Linux on 22.04: the binary then needs glibc 2.35 or newer.
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    # Frozen inputs: action pinned to a commit (the tag in the comment, kept up to date by
    # Dependabot) and `--locked`, so the published binary is built from the committed Cargo.lock.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      # Reproducible output (see docs/reproducible-builds.md): the same commit gives the same bytes.
      # The archives take the commit date instead of the clock; the executable gets its linker flags
      # from .cargo/config.toml and has the paths of this runner replaced by fixed names.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Commit date and path hiding
        shell: bash
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          python -I tools/release/hide_paths.py config "$RUNNER_TEMP/hide-paths.toml"
      # `dist` is the shipped profile (Cargo.toml): `release` plus what only the shipped file gets.
      - name: Build (shipped profile, dist)
        shell: bash
        run: cargo build --locked --profile dist -p rc-app --config "$RUNNER_TEMP/hide-paths.toml"
      - name: Package for Windows
        if: runner.os == 'Windows'
        shell: bash
        run: python -I tools/release/pack.py windows "${GITHUB_REF_NAME#v}" target/dist/rustcraft.exe pkg
      - name: Package for Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p pkg
          cp target/dist/rustcraft pkg/rustcraft
          strip pkg/rustcraft
          python -I tools/release/pack.py linux "${GITHUB_REF_NAME#v}" pkg/rustcraft pkg
      # On the file that is shipped: before `strip`, the Linux executable also holds the debug info,
      # which is never published.
      - name: No path of this runner left in the shipped executable
        shell: bash
        run: |
          exe=pkg/rustcraft
          if [ "$RUNNER_OS" = Windows ]; then exe=target/dist/rustcraft.exe; fi
          python -I tools/release/hide_paths.py check "$exe"
      # One step and one format for both systems. PowerShell's Set-Content ended the Windows sum
      # with CRLF: `sha256sum -c` then reads the CR as part of the file name and fails. Git Bash's
      # sha256sum writes " *name" where Linux writes "  name", so the line is written by hand:
      # "<hash>  <name>" and a LF, the format of the Linux sums of earlier releases.
      - name: Checksum
        shell: bash
        working-directory: pkg
        run: |
          shopt -s nullglob
          archives=(rustcraft-*.zip rustcraft-*.tar.gz)
          [ "${#archives[@]}" -eq 1 ] || { echo "::error::expected one archive, found: ${archives[*]}"; exit 1; }
          name="${archives[0]}"
          hash=$(sha256sum "$name" | cut -d' ' -f1)
          printf '%s  %s\n' "$hash" "$name" > "$name.sha256"
          cat "$name.sha256"
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" pkg/rustcraft-* --repo "$GITHUB_REPOSITORY"

  # Checks the published files the way a user does: download them, then `sha256sum -c`.
  verify:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Download the release and check every checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets && cd assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern 'rustcraft-*'
          ls -l
          for name in rustcraft-*-windows-x64.zip rustcraft-*-linux-x64.tar.gz; do
            [ -f "$name" ] && [ -f "$name.sha256" ] || { echo "::error::missing archive or checksum: $name"; exit 1; }
          done
          # A CRLF ending is the defect this job guards against: name it rather than leave a
          # bare "FAILED open or read". `-U` keeps the CR visible to grep under Git Bash too.
          if grep -lU $'\r' ./*.sha256; then echo "::error::checksum file with a CRLF ending"; exit 1; fi
          sha256sum --check --strict ./*.sha256
