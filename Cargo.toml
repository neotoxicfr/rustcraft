[workspace]
resolver = "3"
members = ["apps/*", "crates/*", "tools/rc-capture"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
rc-proto = { path = "crates/rc-proto" }
rc-net = { path = "crates/rc-net" }
thiserror = "2"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
aes = "0.9.3"
libdeflater = "1.26.1"
serde_json = "1"
# Visitor traits (advancements file read with its key order, `rc-sim` progress).
serde = "1.0.229"
hashbrown = { version = "0.17.1", features = ["rayon"] }
# Fixed-seed hashing of the client's cache keys (the hasher hashbrown already uses).
foldhash = { version = "0.2.0", default-features = false }
ureq = "3.4.2"
ring = "0.17.14"
getrandom = { version = "0.4.3", features = ["sys_rng"] }
rand_core = "0.10.1"
rsa = { version = "=0.10.0-rc.22", default-features = false, features = ["std", "encoding"] }
base64 = "0.23.1"
# Unicode character names (SNBT `\N{name}` escape of the commands).
unicode_names2 = "4.0.0"
ipconfig = { version = "0.3.4", default-features = false }
sha1 = "0.11.0"
md-5 = "0.11.0"
crossbeam-channel = "0.5.17"
rayon = "1.12.0"
# Short strings stored in place (numbers and keys of the generation JSON); already in the tree through winit.
smol_str = "0.3.7"
mimalloc = { version = "0.1.52", default-features = false }
# Only the backends the client can pick (`gpu_backend.rs`: Vulkan, DX12; Metal kept for macOS):
# the default OpenGL (gles: glow, EGL, GLSL output) and WebGPU backends are dead code here.
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "vulkan", "metal", "wgsl"] }
winit = "0.30.13"
glam = { version = "0.34.1", features = ["bytemuck"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
pollster = "1.0.1"
rc-client = { path = "crates/rc-client" }
rc-mesh = { path = "crates/rc-mesh" }
rc-assets = { path = "crates/rc-assets" }
rc-testdata = { path = "crates/rc-testdata" }
rc-physics = { path = "crates/rc-physics" }
png = "0.18.1"
zip = { version = "9.0.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
rc-data = { path = "crates/rc-data" }
rc-world = { path = "crates/rc-world" }
rc-env = { path = "crates/rc-env" }
rc-text = { path = "crates/rc-text" }
rc-proto-v777 = { path = "crates/rc-proto-v777" }
rc-audio = { path = "crates/rc-audio" }
rc-commands = { path = "crates/rc-commands" }
unicode-bidi = "0.3.18"
unicode-bidi-mirroring = "0.4.0"
# Micro-benches of several crates: one declaration so that every crate builds the same criterion.
criterion = { version = "0.8.2", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
or_fun_call = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# The shipped executable (release.yml, reproducibility.yml, docs/reproducible-builds.md). A setting
# meant for the shipped file only (fat LTO, `panic = "abort"`: docs/perf.md, C7-M04) goes here, so
# that tests, clippy and the `prepare` example keep building with `release` and nothing is compiled
# twice. Same settings as `release` until those leads are measured on a quiet machine
# (`tools/bench/build_matrix.py`).
[profile.dist]
inherits = "release"
